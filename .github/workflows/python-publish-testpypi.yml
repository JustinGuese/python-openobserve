---
# SPDX-FileCopyrightText: 2025 The python_openobserve authors
# SPDX-License-Identifier: GPL-3.0-or-later
name: Upload Python Package to Test PyPI

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Upload release to Test PyPI
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/python-openobserve/
    permissions:
      id-token: write
    steps:
      # retrieve your distributions here
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          set -x
          pip install -r requirements-build.txt

      - name: Build package
        run: >-
          python -m
          build
          --sdist
          --wheel
          --outdir dist/

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format json --output-file dist/bom.json

      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Remove CycloneDX SBOM file - unsupported by pypi-publish
        run: rm dist/bom.json
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          print-hash: true
