[project]
name = "python-openobserve"
version = "0.5.1"
description = "OpenObserve client for Python"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license-files = [
    "LICENSES/CC-BY-4.0.txt",
    "LICENSES/CC-BY-SA-4.0.txt",
    "LICENSES/GPL-3.0-or-later.txt",
]
authors = [{name = "Justin Guese", email = "guese.justin@gmail.com"}]
keywords = ["openobserve", "elasticsearch", "logging", "unstructured data"]
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "cryptography (>=48.0.1,<48.1.0)",
    "h11~=0.16.0",
    "httpcore~=1.0.9",
    "httpx~=0.28",
    "protobuf>=6.33.5",
    "pydantic~=2.10",
    "python-multipart>=0.0.22",
    "sqlglot~=26.4.0",
    "pyjwt (>=2.12.1,<3.0.0)",
    "requests (>=2.33.0,<3.0.0)",
]

[project.urls]
Homepage = "https://github.com/JustinGuese/python-openobserve"
Repository = "https://github.com/JustinGuese/python-openobserve"

[project.scripts]
python_openobserve = "python_openobserve:openobserve"

[project.optional-dependencies]
ci = [
    "jmespath==1.1.0",
    "memray==1.19.3",
    "pytest-memray==1.8.0",
    "mypy==1.20.2",
    "mypy-extensions==1.1.0",
    "pandas==2.3.3",
    "pandas-stubs==2.3.3.260113",
    "pytest==9.1.1",
    "pytest-cov==6.3.0",
    "python-dotenv==1.2.2",
    "types-jmespath==1.0.2.20240106",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.6",
    "mkdocstrings==0.30.1",
]
tests = ["pytest==9.1.1", "jmespath==1.1.0", "python-dotenv==1.2.2"]
pandas = ["pandas>=2.2"]
polars = ["polars==1.42.0"]

[tool.poetry.group.test.dependencies]
pytest = "9.1.1"
jmespath = "1.1.0"
python-dotenv = "1.2.2"

[tool.poetry.group.docs.dependencies]
mkdocs = "1.6.1"
mkdocs-material = "9.7.6"
mkdocstrings = "0.30.1"

[tool.poetry.group.ci.dependencies]
jmespath = "1.1.0"
memray = "1.19.3"
pytest-memray = "1.8.0"
mypy = "1.20.2"
mypy-extensions = "1.1.0"
pandas = "2.3.3"
openpyxl = "3.1.5"
pandas-stubs = "2.3.3.260113"
pytest = "9.1.1"
pytest-cov = "6.3.0"
python-dotenv = "1.2.2"
types-jmespath = "1.0.2.20240106"

[tool.poetry.group.pandas.dependencies]
pandas = ">2.2"

[tool.poetry.group.polars.dependencies]
polars = "1.42.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.bandit]
skips = ["B101"]
