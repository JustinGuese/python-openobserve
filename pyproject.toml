[project]
name = "python-openobserve"
version = "0.5.2"
description = "OpenObserve client for Python"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license-files = [
    "LICENSES/CC-BY-4.0.txt",
    "LICENSES/CC-BY-SA-4.0.txt",
    "LICENSES/GPL-3.0-or-later.txt",
]
authors = [{name = "Justin Guese", email = "guese.justin@gmail.com"}]
keywords = ["openobserve", "elasticsearch", "logging", "unstructured data"]
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "cryptography (>=50.0.0,<50.1.0)",
    "h11~=0.16.0",
    "httpcore~=1.0.9",
    "httpx~=0.28",
    "protobuf>=7.35.1",
    "pydantic~=2.10",
    "python-multipart>=0.0.22",
    "sqlglot~=30.18.0",
    "pyjwt (>=2.12.1,<3.0.0)",
    "requests (>=2.33.0,<3.0.0)",
]

[project.urls]
Homepage = "https://github.com/JustinGuese/python-openobserve"
Repository = "https://github.com/JustinGuese/python-openobserve"

[project.scripts]
python_openobserve = "python_openobserve:openobserve"

[project.optional-dependencies]
ci = [
    "jmespath==1.1.0",
    "memray==1.20.0",
    "pytest-memray==1.10.0",
    "mypy==2.3.1",
    "mypy-extensions==1.1.0",
    "pandas==2.3.3",
    "pandas-stubs==2.3.3.260113",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "python-dotenv==1.2.3",
    "types-jmespath==1.1.0.20260724",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "mkdocstrings==1.0.6",
]
tests = ["pytest==9.1.1", "jmespath==1.1.0", "python-dotenv==1.2.3"]
pandas = ["pandas>=2.2"]
polars = ["polars==1.44.2"]

[tool.poetry.group.test.dependencies]
pytest = "*"
jmespath = "*"
python-dotenv = "*"

[tool.poetry.group.docs.dependencies]
mkdocs = "*"
mkdocs-material = "*"
mkdocstrings = "*"

[tool.poetry.group.ci.dependencies]
jmespath = "*"
memray = "*"
pytest-memray = "*"
mypy = "*"
mypy-extensions = "*"
pandas = "*"
openpyxl = "*"
pandas-stubs = "*"
pytest = "*"
pytest-cov = "*"
python-dotenv = "*"
types-jmespath = "*"

[tool.poetry.group.pandas.dependencies]
pandas = ">2.2"

[tool.poetry.group.polars.dependencies]
polars = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.bandit]
skips = ["B101"]
